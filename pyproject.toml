[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-timetable"
version = "0.1.0"
description = "Configurable school timetable optimization system (solver proof-of-concept milestone)"
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: heavier tests (school-scale fixture generation/solving) excluded from the default run; use -m slow to run them",
]
addopts = "-m 'not slow'"
